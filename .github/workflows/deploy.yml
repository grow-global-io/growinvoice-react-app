on:
  push:
    branches:
      - main
name: 🚀 Deploy website on push

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # create .env file
      - name: 📄 Create .env File
        run: |
          echo "VITE_APP_BASE_URL=https://api-dev.growinvoice.com" > .env
          echo "VITE_FIREBASE_PROJECT_ID=growinvoice-957bc" >> .env
          echo "VITE_FIREBASE_API_KEY=AIzaSyBQNfsPslDOa9at0zbCx3iFxCs66flfJVw" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=1009012687487" >> .env
          echo "VITE_FIREBASE_APP_ID=1:1009012687487:web:00390aec097f131269b54a" >> .env
          echo "VITE_FIREBASE_MEASUREMENT_ID=G-SH0S2QYNFJ" >> .env
          echo "VITE_GOOGLE_CLIENT_ID=756951966109-3v1n4n441iq4agtb0pkve9dr9bjf0o9i.apps.googleusercontent.com" >> .env
      - name: 📦 Upload .env File
        uses: actions/upload-artifact@v4
        with:
          name: env-file
          path: .env

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: 📦 Install dependencies and build
        run: |
          yarn install --frozen-lockfile --non-interactive --prefer-offline
          yarn cache clean --all
          yarn run build

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: "ftp.growinvoice.com"
          username: "u644247801.reactgrowinvoice"
          password: ${{ secrets.GIT_CPANEL_REACT_PWD }}
          local-dir: ./dist/
